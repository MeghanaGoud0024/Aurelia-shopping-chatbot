[pytest]
testpaths = tests
# Explicit rather than inherited from a plugin default: asyncio tests must be
# marked, so a coroutine test that loses its marker fails loudly instead of
# being silently collected and never awaited.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::RuntimeWarning
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
addopts = -q --strict-markers --strict-config
